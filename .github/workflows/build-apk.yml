name: Gerar APK Jornalera V3

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x ./gradlew  # Forzamos la ruta relativa explícita de la raíz

      - name: Gerar APK debug
        run: ./gradlew :app:assembleDebug


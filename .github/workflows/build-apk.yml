name: Gerar APK Jornalera V3

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Forzar Compilación desde Directorio Real
        run: |
          echo "=== UBICACIÓN ACTUAL ==="
          pwd
          echo "=== ARCHIVOS DETECTADOS ==="
          ls -la
          
          # Si el archivo gradle-wrapper no está listo, lo forzamos de forma nativa
          echo "=== GENERANDO ENTORNO GRADLE ==="
          gradle wrapper --gradle-version 8.9
          
          echo "=== ASIGNANDO PERMISOS ==="
          chmod +x ./gradlew
          
          echo "=== INICIANDO COMPILACIÓN DE APK ==="
          ./gradlew :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Jornalera-V3-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

name: Gerar APK Jornalera V3

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-24.04  # 1. Fijado a una versión estable para evitar problemas de compatibilidad
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x gradlew  # 2. CORRECCIÓN ERROR 127: Otorga permisos al script de Gradle

      - name: Gerar APK debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Jornalera-V3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

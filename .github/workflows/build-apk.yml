name: Gerar APK Jornalera V3

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Detectar carpeta del proyecto y compilar APK
        run: |
          # 1. Busca el archivo de configuración settings.gradle o settings.gradle.kts
          SETTINGS_PATH=$(find . -name "settings.gradle*" -print -quit)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Error: No se encontró ningún archivo settings.gradle en el repositorio."
            exit 1
          fi
          
          # 2. Extrae el directorio real del proyecto
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "¡Proyecto detectado con éxito en el directorio!: $PROJECT_DIR"
          
          # 3. Entra a la carpeta, da permisos al wrapper existente y compila
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Jornalera-V3-debug-apk
          path: |
            **/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

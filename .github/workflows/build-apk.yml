name: Gerar APK Jornalera V3

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Buscar directorio, dar permisos y compilar APK
        run: |
          # 1. Busca dónde está guardado gradlew en el repositorio
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: No se encontró el archivo gradlew en ningún lugar del repositorio."
            exit 1
          fi
          
          # 2. Extrae el directorio donde se ubica gradlew
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Proyecto de Android detectado en: $GRADLE_DIR"
          
          # 3. Cambia al directorio, da permisos y ejecuta la compilación
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Jornalera-V3-debug-apk
          path: |
            **/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
